variables:
  claims_input:
    type: string
    description: "Path to the input claims data"
  policyholders_input:
    type: string
    description: "Path to the input policyholders data"
  output:
    type: string
    description: "Path to the output transformed data"

resources:
  jobs:
    claim_etl_job:
      name: claim-etl-${bundle.target}
      max_concurrent_runs: 1

      tasks:
        - task_key: transform_claims
          spark_python_task:
            python_file: ../src/claim_etl_job.py
            parameters:
              - --claims-input
              - ${var.claims_input}
              - --policyholders-input
              - ${var.policyholders_input}
              - --output
              - ${var.output}
          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "4"

      schedule:
        quartz_cron_expression: 0 0 2 * * ?
        timezone_id: UTC
        pause_status: PAUSED